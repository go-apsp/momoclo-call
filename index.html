<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ももクロ コール共有(プロトタイプ)title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#14152b;--panel:#262a4a;--ink:#f4f4fb;--pink:#ff7ab8;--mut:#a9acd0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
header{display:flex;justify-content:space-between;align-items:center;height:44px;position:relative}
h1{font-size:18px;font-weight:900;margin:0}h1 b{color:var(--pink)}
.row{display:flex;align-items:center;gap:4px}
.pill{min-width:44px;height:44px;border-radius:22px;border:2px solid var(--pink);padding:0 12px;font-weight:700;font-size:12px}
.ico{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
#me{width:44px;height:44px;border-radius:50%;border:4px solid #fff;background:var(--bg);font-weight:900}
#menu{position:absolute;right:0;top:50px;width:240px;padding:8px;border-radius:16px;background:var(--panel);border:1.5px solid var(--pink);display:none;z-index:5}
#menu button{display:block;width:100%;height:52px;border-radius:12px;font-weight:900;text-align:left;padding:0 14px;margin-top:6px;border:1px solid #8e91b8}
#menu button:first-child{margin:0;background:rgba(255,122,184,.18);border:0}
#mv{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#3a1d5c,#1a2a5e 55%,#5c1d3f)}
#yt,#yt iframe{position:absolute;inset:0;width:100%;height:100%}
.crowd{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:20px;opacity:.55;pointer-events:none}
#card{position:absolute;left:50%;bottom:10px;transform:translateX(-50%) scale(.9);width:68%;padding:8px 12px;border-radius:16px;background:rgba(20,21,43,.28);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 22px rgba(255,122,184,.65);text-align:center;opacity:0;transition:.2s;pointer-events:none}
#card.on{opacity:1;transform:translateX(-50%) scale(1)}
#card small{display:block;font-size:11px;font-weight:700;color:#ffd2e6}
#card strong{font-size:21px;font-weight:900;text-shadow:0 0 10px var(--pink)}
#nosc{display:none;font-size:9px;font-style:normal;opacity:.75;margin-top:2px}
#next{position:absolute;right:8px;top:8px;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.18);border:1px dashed rgba(255,255,255,.6);font-size:10px;font-weight:700;opacity:0;transform-origin:top right;pointer-events:none}
#pen{position:absolute;left:12px;bottom:0;width:10px;height:70px;border-radius:5px;transform-origin:50% 100%;opacity:0;background:currentColor;box-shadow:0 0 18px currentColor;pointer-events:none}
#pen.on{opacity:1;animation:sway 1s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
@media (prefers-reduced-motion:reduce){#pen.on{animation:none}}
.pads{display:flex;justify-content:center;align-items:flex-end;gap:14px}
.sq{width:84px;height:84px;border-radius:20px;font-weight:900;font-size:15px;line-height:1.2}
#penbtn{border:2px solid var(--pink);background:radial-gradient(circle at 50% 35%,var(--pink),#5a1f46 70%);box-shadow:0 0 20px rgba(255,122,184,.7);font-size:12px}
#wakubtn{border:2px solid #ffd23f;background:#2a2410;color:#ffd23f}
#wakubtn.hot{background:#ffd23f;color:#2a2410;box-shadow:0 0 24px #ffd23f}
#q{position:relative;width:20px;height:20px;border-radius:50%;border:1px solid #8e91b8;color:var(--mut);font-size:12px;font-weight:700;margin:0 0 4px -8px}
#q::after{content:"";position:absolute;inset:-12px}
.dots{display:flex;justify-content:center}
.dots button{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.dots i{width:24px;height:24px;border-radius:50%;display:block}
.dots .sel i{outline:3px solid #fff;outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--pink);height:28px;margin:0}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
#play{height:56px;border-radius:28px;background:var(--pink);color:#2a0c1c;font-weight:900;font-size:16px}
#info{font-size:12px;color:var(--mut);text-align:center}
#ov{position:fixed;inset:0;background:rgba(14,15,34,.92);display:none;z-index:10;overflow:auto}
#ov .in{max-width:480px;margin:0 auto;padding:16px}
.oh{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:19px;margin-bottom:8px}
.oh b{color:var(--pink);font-size:22px}
.u{border-radius:18px;padding:12px 14px;margin-bottom:10px}
.hd{width:100%;display:flex;align-items:center;gap:10px;min-height:44px;text-align:left;font-weight:900;font-size:15px}
.hd b{font-size:17px}.sp{flex:1}
.av{width:40px;height:40px;border-radius:50%;border:4px solid;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.dt{display:none;flex-direction:column;gap:10px;margin-top:10px;font-size:12px;line-height:1.6}
.u.open .dt{display:flex}
.tag{display:inline-block;padding:2px 10px;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;font-size:11px;margin-left:6px}
.used{color:#ffd23f;font-weight:700}
.act{display:flex;gap:8px;flex-wrap:wrap}
.act button{flex:1;min-width:84px;height:44px;border-radius:22px;border:2px solid var(--ink);font-weight:700;font-size:13px}
.act .w{background:var(--ink);color:var(--bg);font-weight:900}
.act .hr{flex:none;min-width:76px;padding:0 12px;border-color:transparent;color:#fff;font-weight:900}
#mk{display:none;padding:14px;border-radius:18px;background:var(--panel);flex-direction:column;gap:10px}
#mk h2{margin:0;font-size:16px}
.seek{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.seek button{height:44px;border-radius:12px;border:2px solid #8e91b8;font-weight:700;font-size:11px}
.types{display:flex;gap:8px}
.types button{flex:1;height:44px;border-radius:22px;border:2px solid #8e91b8;font-weight:700;font-size:12px}
.types .sel{background:var(--ink);color:var(--bg)}
#mk input[type=text],#sheet input{height:44px;border-radius:12px;border:2px solid #8e91b8;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;width:100%}
#mk label{font-size:12px;display:flex;align-items:center;gap:8px;min-height:44px}
#mk .add{height:48px;border-radius:24px;background:#ffd23f;color:#2a2410;font-weight:900}
.mkrow{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px;border-bottom:1px solid #3a3f6b}
.mkrow button{width:44px;height:44px;font-size:18px;color:var(--mut)}
#sheet{position:fixed;inset:0;background:rgba(10,10,24,.7);display:none;align-items:flex-end;z-index:20}
#sheet>div{width:100%;max-width:480px;margin:0 auto;background:var(--panel);border-radius:20px 20px 0 0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
#sheet h2,#sheet input,#sheet p{grid-column:1/3;margin:0}
#sheet h2{font-size:16px}#sheet p{font-size:12px;color:var(--mut)}
#sheet button{height:52px;border-radius:14px;border:4px solid;font-weight:900;background:var(--bg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-weight:700;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
#toast.on{opacity:1}
</style>
</head>
<body>
<script>
(function () {
  function show(m) {
    var d = document.getElementById("err");
    if (!d) { d = document.createElement("div"); d.id = "err"; d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#b00020;color:#fff;font-size:12px;padding:8px;white-space:pre-wrap"; document.body.appendChild(d); }
    d.textContent += m + "\n";
  }
  window.addEventListener("error", function (e) { show("エラー: " + (e.message || "読み込み失敗") + (e.lineno ? " (行" + e.lineno + ")" : "")); });
  window.addEventListener("unhandledrejection", function (e) { show("エラー: " + (e.reason && e.reason.message || e.reason)); });
  window.__show = show;
  window.__last = "モジュール未開始";
  window.__step = function (m) {
    window.__last = m;
    var d = document.getElementById("stp");
    if (!d) { d = document.createElement("div"); d.id = "stp"; d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99;background:#1b5e20;color:#fff;font-size:12px;padding:6px 8px"; document.body.appendChild(d); }
    d.textContent = "進行: " + m;
  };
  window.__ok = false;
  setTimeout(function () { if (!window.__ok) show("起動できていません / 最後の進行: " + window.__last + " / 読み込み状態: " + document.readyState); }, 15000);
})();
</script>
<div id="app">
  <header>
    <h1>ももクロ <b>コール</b>共有( テスト中)/h1>
    <div class="row">
      <button class="pill" id="login" data-a="login">ログイン</button>
      <button class="ico" aria-label="メニュー" data-a="menu"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M4 7h18M4 13h18M4 19h18" fill="none" stroke="#f4f4fb" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div id="menu">
      <button data-a="openOv">みんなの<span style="color:var(--pink)">推し</span>コール</button>
      <button id="mkbtn" data-a="startMk" style="display:none">推しコールを作る</button>
      <button id="oshibtn" data-a="editProf" style="display:none">推しを変更</button>
      <button id="logout" data-a="logout" style="display:none">ログアウト</button>
    </div>
  </header>

  <div id="mv">
    <div id="yt"></div>
    <div id="next">NEXT</div>
    <div class="crowd">🙌🙌🙌🙌🙌🙌🙌🙌</div>
    <div id="pen" style="color:#ff7ab8"></div>
    <div id="card"><small id="cl"></small><strong id="tx"></strong><em id="nosc">このスコアは反映されません</em></div>
  </div>

  <div class="pads">
    <button class="sq" id="penbtn" data-a="pen">ペンライト</button>
    <button class="sq" id="wakubtn" data-a="waku">自分も<br>湧く!</button>
    <button id="q" aria-label="説明" data-a="help">?</button>
  </div>
  <div class="dots" id="dots"></div>
  <div>
    <input type="range" id="bar" min="0" max="240" step="0.1" value="0" aria-label="シークバー">
    <div class="times"><span id="tm">0:00</span><span id="dur">0:00</span></div>
  </div>
  <button id="play" data-a="play">再生</button>
  <div id="info"></div>
  <div style="text-align:center;font-size:10px;color:#6b6e90">build 8</div>

  <section id="mk">
    <h2>推しコールを作る</h2>
    <div class="seek">
      <button data-a="seek" data-i="-30">-30秒</button><button data-a="seek" data-i="-10">-10秒</button><button data-a="seek" data-i="-1">-1秒</button>
      <button data-a="seek" data-i="1">+1秒</button><button data-a="seek" data-i="10">+10秒</button><button data-a="seek" data-i="30">+30秒</button>
    </div>
    <div id="mkTypes" class="types">
      <button data-a="type" data-i="call" class="sel">コール</button><button data-a="type" data-i="sing">シンガロン</button><button data-a="type" data-i="koko">ココ好き!</button>
    </div>
    <input type="text" id="mkText" placeholder="内容(例: ハイ!ハイ!)" maxlength="30">
    <button class="add" data-a="addScene">この位置に追加</button>
    <div id="mkList"></div>
    <input type="text" id="mkVer" placeholder="バージョン名(2つ目以降は必須)" maxlength="20">
    <input type="text" id="mkNote" placeholder="備考(任意)" maxlength="100">
    <label><input type="checkbox" id="mkRef" checked> 参考にしてよい</label>
    <div class="act">
      <button data-a="save" data-i="0">下書き保存</button>
      <button class="w" data-a="save" data-i="1">公開</button>
      <button data-a="endMk">やめる</button>
    </div>
  </section>
</div>

<div id="ov"><div class="in">
  <div class="oh"><span>みんなの<b>推し</b>コール</span><button class="ico" aria-label="閉じる" data-a="closeOv"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 6l14 14M20 6L6 20" fill="none" stroke="#f4f4fb" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
  <div id="list"></div>
</div></div>

<div id="sheet"><div>
  <h2>はじめての登録</h2>
  <p>ニックネームは他の人に表示されます。推しは、あとからメニューで変えられます。</p>
  <input type="text" id="nick" placeholder="ニックネーム" maxlength="20">
</div></div>
<div id="toast"></div>

<script>window.__step("0 ページの本文は読み込み済み");</script>
<script src="app.js?v=8" onerror="window.__show('app.js を読み込めません。app.js もアップロードしてください')"></script>
</body>
</html>
