<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ももクロコール共有(テスト中)</title>
<link rel="stylesheet" href="style.css?v=12">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
</head>
<body>
<script>
(function () {
  function show(m) {
    var d = document.getElementById("err");
    if (!d) { d = document.createElement("div"); d.id = "err"; d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;background:#b00020;color:#fff;font-size:12px;padding:8px;white-space:pre-wrap"; document.body.appendChild(d); }
    d.textContent += m + "\n";
  }
  window.addEventListener("error", function (e) { show("エラー: " + (e.message || "読み込み失敗") + (e.lineno ? " (行" + e.lineno + ")" : "")); });
  window.addEventListener("unhandledrejection", function (e) { show("エラー: " + (e.reason && e.reason.message || e.reason)); });
  window.__show = show; window.__ok = false;
  setTimeout(function () { if (!window.__ok) show("起動できていません(ファイルが全部アップロードされているか確認してください)"); }, 15000);
})();
</script>
<div id="app">
  <header>
    <h1>ももクロ<b>コール</b>共有<small>(テスト中)</small></h1>
    <div class="row">
      <button class="pill" id="login" data-a="login">ログイン</button>
      <button class="ico" aria-label="メニュー" data-a="menu"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M4 7h18M4 13h18M4 19h18" fill="none" stroke="#f4f4fb" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div id="menu">
      <button data-a="openOv">みんなの<span style="color:var(--pink)">推し</span>コール</button>
      <button id="mkbtn" data-a="startMk" style="display:none">推しコールを作る</button>
      <button id="oshibtn" data-a="editProf" style="display:none">推し・アイコンの変更</button>
      <button id="logout" data-a="logout" style="display:none">ログアウト</button>
      <label class="mrow">カードの位置(上げる)<input type="range" id="cpos" min="0" max="120" value="0"></label>
    </div>
  </header>

  <div id="songbox"></div>
  <div id="tot"></div>
  <div id="who"></div>
  <div id="mv">
    <div id="yt"></div>
    <div id="nexts"></div>
    <div class="crowd">🙌🙌🙌🙌🙌🙌🙌🙌</div>
    <div id="pen" style="color:#fff"></div>
    <div id="cards"></div>
    <button id="fsplay" class="fsonly" data-a="play">再生</button>
    <div id="fspads" class="fsonly"><button class="sq penb" data-a="pen">ペンライト</button><button class="sq wk" data-a="waku">湧く!</button></div>
    <button id="fsinfo" class="fsonly" data-a="panel" aria-label="推しコールの情報">i</button>
    <div id="panel"><button class="pc" data-a="panel" aria-label="縮める"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 8l6 6 6-6" fill="none" stroke="#f4f4fb" stroke-width="2.2" stroke-linecap="round"/></svg></button><div id="panelbody"></div></div>
    <button id="fsbtn" data-a="fs" aria-label="全画面"><svg class="ex" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 8V3h5M14 3h5v5M19 14v5h-5M8 19H3v-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><svg class="sh" viewBox="0 0 22 22" aria-hidden="true"><path d="M8 3v5H3M19 8h-5V3M14 19v-5h5M3 14h5v5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>

  <div class="pads">
    <button class="sq penb" id="penbtn" data-a="pen">ペンライト</button>
    <button class="sq wk" id="wakubtn" data-a="waku">湧く!</button>
    <button id="q" aria-label="説明" data-a="help">?</button>
  </div>
  <button id="applybtn" data-a="apply" style="display:none"></button>
  <div class="dots" id="dots"></div>
  <div>
    <input type="range" id="bar" min="0" max="240" step="0.1" value="0" aria-label="シークバー">
    <div class="times"><span id="tm">0:00</span><span id="dur">0:00</span></div>
  </div>
  <button id="play" data-a="play">再生</button>
  <button id="ovbtn" data-a="openOv">みんなの<span>推し</span>コール</button>
  <div id="info"></div>
  <div style="text-align:center;font-size:10px;color:#8e91b8">build 12</div>

  <section id="mk">
    <h2>推しコールを作る</h2>
    <div class="seek">
      <button data-a="seek" data-i="-30">-30秒</button><button data-a="seek" data-i="-10">-10秒</button><button data-a="seek" data-i="-1">-1秒</button>
      <button data-a="seek" data-i="1">+1秒</button><button data-a="seek" data-i="10">+10秒</button><button data-a="seek" data-i="30">+30秒</button>
    </div>
    <div id="mkTypes" class="types">
      <button data-a="type" data-i="call" class="sel">コール</button><button data-a="type" data-i="sing">シンガロン</button><button data-a="type" data-i="koko">ココ好き!</button>
    </div>
    <input type="text" id="mkText" placeholder="内容(例: ハイ!ハイ!)" maxlength="30">
    <button class="add" data-a="addScene">この位置に追加</button>
    <div id="mkList"></div>
    <input type="text" id="mkVer" placeholder="バージョン名(2つ目以降は必須)" maxlength="20">
    <input type="text" id="mkNote" placeholder="備考(任意)" maxlength="100">
    <label><input type="checkbox" id="mkRef" checked> 参考にしてよい</label>
    <div class="act">
      <button data-a="save" data-i="0">下書き保存</button>
      <button class="w" data-a="save" data-i="1">公開</button>
      <button data-a="endMk">やめる</button>
    </div>
  </section>
</div>

<div id="ov"><div class="in">
  <div class="oh"><span>みんなの<b>推し</b>コール</span><button class="ico" aria-label="閉じる" data-a="closeOv"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M6 6l14 14M20 6L6 20" fill="none" stroke="#f4f4fb" stroke-width="2.4" stroke-linecap="round"/></svg></button></div>
  <button id="refcall" data-a="refcall">参考コール</button>
  <div id="list"></div>
</div></div>

<div id="sheet"><div>
  <h2>はじめての登録</h2>
  <p>ニックネームは他の人に表示されます。推しとアイコンは、あとからメニューで変えられます。</p>
  <input type="text" id="nick" placeholder="ニックネーム" maxlength="20">
  <div id="icons"></div>
</div></div>
<div id="toast"></div>

<script src="ui.js?v=12" onerror="window.__show('ui.js を読み込めません。ui.js もアップロードしてください')"></script>
<script src="app.js?v=12" onerror="window.__show('app.js を読み込めません。app.js もアップロードしてください')"></script>
</body>
</html>
