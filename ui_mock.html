<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>推しコール作成 UIモック (スマホ対応版)</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 10px;
            margin: 0;
            background: #f0f4f8;
            user-select: none;
            -webkit-user-select: none;
            touch-action: pan-y; /* 縦スクロールは許可、横のジェスチャーを無効化 */
        }
        h2 {
            font-size: 1.1rem;
            color: #333;
            margin-top: 15px;
        }
        .container {
            max-width: 100%;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* タイムライン */
        #timeline {
            position: relative;
            width: 100%;
            height: 60px;
            background: #e2e8f0;
            border-radius: 8px;
            margin: 15px 0;
            overflow: hidden;
            touch-action: none;
        }
        .card {
            position: absolute;
            top: 5px;
            height: 50px;
            background: #FFD700;
            border: 2px solid #FF8C00;
            border-radius: 6px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            color: #d35400;
            overflow: hidden;
            white-space: nowrap;
            transition: border 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .card.droppable-hover {
            box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.5) inset;
            border-color: #d35400;
            background: #ffe066;
        }

        /* 作成ボタン */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        #record-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #ff4757;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            cursor: pointer;
            outline: none;
            box-shadow: 0 6px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* デフォルトのタッチ動作を無効化 */
        }
        #record-btn:active, #record-btn.active {
            transform: scale(0.92);
            background: #ff6b81;
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
        }

        /* プリセット＆テキスト入力 */
        .tools-area {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #cbd5e1;
        }
        .preset-chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .chip {
            padding: 8px 12px;
            background: #3498db;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(52,152,219,0.3);
            touch-action: none;
            -webkit-user-select: none;
        }
        .chip.dragging {
            opacity: 0.5;
            background: #2980b9;
        }

        .custom-input-area {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        #custom-text {
            flex: 1;
            min-width: 0; /* Flexboxのはみ出し防止 */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            -webkit-appearance: none;
        }
        #drag-handle {
            padding: 0 15px;
            background: #2ecc71;
            color: white;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(46, 204, 113, 0.3);
            touch-action: none;
            -webkit-user-select: none;
        }
        #drag-handle.dragging {
            opacity: 0.5;
            background: #27ae60;
        }

        /* ドラッグ中のフローティング要素 */
        #ghost-element {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            padding: 8px 12px;
            background: rgba(52,152,219, 0.9);
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transform: translate(-50%, -50%) scale(1.1); /* 指の中心に配置し少し拡大 */
            display: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>1. 長押しでカード作成</h2>
    <p style="font-size:0.75rem; color:#666; margin-top:5px;">ボタンを長押しで長さ調整。短くタップで標準サイズ。</p>

    <div class="btn-wrapper">
        <button id="record-btn">長押しで<br>湧く！</button>
    </div>

    <div id="timeline">
        <!-- カードがここに追加される -->
    </div>

    <h2>2. スワイプで文字を入れる</h2>
    <div class="tools-area">
        <p style="font-size:0.75rem; color:#666; margin-top:0;">青いチップを上のカードへ引っ張る</p>
        <div class="preset-chips">
            <div class="chip" data-text="うりゃおい！">うりゃおい！</div>
            <div class="chip" data-text="あーりん！">あーりん！</div>
            <div class="chip" data-text="オイ！オイ！">オイ！オイ！</div>
            <div class="chip" data-text="＼フッフー／">＼フッフー／</div>
        </div>

        <p style="font-size:0.75rem; color:#666; margin-bottom:5px;">文字を打って緑のボタンを引っ張る</p>
        <div class="custom-input-area">
            <input type="text" id="custom-text" placeholder="コールの文字...">
            <div id="drag-handle">≡ 引っ張る</div>
        </div>
    </div>
</div>

<!-- スマホ用ドラッグ時のゴースト要素 -->
<div id="ghost-element"></div>

<script>
    const recordBtn = document.getElementById('record-btn');
    const timeline = document.getElementById('timeline');
    const customText = document.getElementById('custom-text');
    const dragHandle = document.getElementById('drag-handle');
    const ghostElement = document.getElementById('ghost-element');

    let isRecording = false;
    let currentCard = null;
    let startTime = 0;
    let startX = 5; // タイムライン上の初期位置(%) モック用
    let animationId = null;
    const MIN_WIDTH = 15; // チョン押しの標準サイズ(%)

    // --- 1. 長押し作成のロジック ---
    function startRecord(e) {
        if(e.type === 'touchstart' || e.type === 'pointerdown') {
            e.preventDefault(); // スクロール等のデフォルト動作を防止
        }
        // 既に記録中なら無視
        if (isRecording) return;

        isRecording = true;
        recordBtn.classList.add('active');
        startTime = Date.now();

        // 新しいカードを生成
        currentCard = document.createElement('div');
        currentCard.className = 'card';
        currentCard.style.left = startX + '%';
        currentCard.style.width = '0%';
        currentCard.innerText = '(空)';
        timeline.appendChild(currentCard);

        updateCardWidth();
    }

    function updateCardWidth() {
        if (!isRecording || !currentCard) return;
        const elapsed = Date.now() - startTime;
        let width = elapsed / 20;
        currentCard.style.width = width + '%';
        animationId = requestAnimationFrame(updateCardWidth);
    }

    function stopRecord(e) {
        if (!isRecording) return;

        // タッチイベントの場合はデフォルト動作を防止
        if(e && (e.type === 'touchend' || e.type === 'touchcancel' || e.type === 'pointerup' || e.type === 'pointercancel')) {
            e.preventDefault();
        }

        isRecording = false;
        recordBtn.classList.remove('active');
        cancelAnimationFrame(animationId);

        // チョン押し判定
        const elapsed = Date.now() - startTime;
        if (elapsed < 300) {
            currentCard.style.width = MIN_WIDTH + '%';
        }

        // 次のカードのスタート位置をずらす（モック用）
        startX += parseFloat(currentCard.style.width) + 2;
        if(startX > 80) startX = 5; // ループ

        currentCard = null;
    }

    // Pointer Eventsを使用 (スマホとPC両対応)
    recordBtn.addEventListener('pointerdown', startRecord);
    window.addEventListener('pointerup', stopRecord);
    window.addEventListener('pointercancel', stopRecord);


    // --- 2. スマホ対応ドラッグ＆ドロップ (Touch Events / Pointer Events 併用) ---

    let draggingText = "";
    let isDragging = false;
    let dragSourceElement = null;

    // ゴースト要素の更新
    function updateGhostPosition(clientX, clientY) {
        ghostElement.style.left = clientX + 'px';
        ghostElement.style.top = clientY + 'px';
    }

    // ドロップターゲット（カード）の当たり判定
    function checkDropTarget(clientX, clientY) {
        const cards = document.querySelectorAll('.card');
        let foundTarget = null;

        cards.forEach(card => {
            const rect = card.getBoundingClientRect();
            if (clientX >= rect.left && clientX <= rect.right &&
                clientY >= rect.top && clientY <= rect.bottom) {
                card.classList.add('droppable-hover');
                foundTarget = card;
            } else {
                card.classList.remove('droppable-hover');
            }
        });
        return foundTarget;
    }

    // ドラッグ開始処理
    function handleDragStart(e, text, sourceElement) {
        isDragging = true;
        draggingText = text;
        dragSourceElement = sourceElement;

        sourceElement.classList.add('dragging');

        ghostElement.innerText = text;
        ghostElement.style.display = 'block';

        let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
        updateGhostPosition(clientX, clientY);
    }

    // ドラッグ中処理
    function handleDragMove(e) {
        if (!isDragging) return;
        e.preventDefault(); // スクロールを止める

        let clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        let clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

        updateGhostPosition(clientX, clientY);
        checkDropTarget(clientX, clientY);
    }

    // ドラッグ終了処理
    function handleDragEnd(e) {
        if (!isDragging) return;

        let clientX = e.type.includes('touch') ? e.changedTouches[0].clientX : e.clientX;
        let clientY = e.type.includes('touch') ? e.changedTouches[0].clientY : e.clientY;

        const targetCard = checkDropTarget(clientX, clientY);

        if (targetCard) {
            // ドロップ成功
            targetCard.innerText = draggingText;
            targetCard.classList.remove('droppable-hover');
        }

        // リセット
        isDragging = false;
        ghostElement.style.display = 'none';
        if (dragSourceElement) {
            dragSourceElement.classList.remove('dragging');
        }

        // 全カードのホバー状態をクリア
        document.querySelectorAll('.card').forEach(c => c.classList.remove('droppable-hover'));
    }

    // イベントリスナーの登録（チップ）
    document.querySelectorAll('.chip').forEach(chip => {
        const startHandler = (e) => {
            e.preventDefault();
            handleDragStart(e, chip.dataset.text, chip);
        };
        chip.addEventListener('touchstart', startHandler, {passive: false});
        chip.addEventListener('mousedown', startHandler);
    });

    // イベントリスナーの登録（カスタムハンドラ）
    const customStartHandler = (e) => {
        // テキストボックスのフォーカスを外す (キーボードを閉じる)
        customText.blur();

        const text = customText.value.trim() || '（空欄）';
        e.preventDefault();
        handleDragStart(e, text, dragHandle);
    };
    dragHandle.addEventListener('touchstart', customStartHandler, {passive: false});
    dragHandle.addEventListener('mousedown', customStartHandler);

    // グローバルな移動・終了イベント
    window.addEventListener('touchmove', handleDragMove, {passive: false});
    window.addEventListener('touchend', handleDragEnd);
    window.addEventListener('touchcancel', handleDragEnd);

    window.addEventListener('mousemove', handleDragMove);
    window.addEventListener('mouseup', handleDragEnd);

</script>
</body>
</html>
